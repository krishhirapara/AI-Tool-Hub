    </linearGradient>
  </defs>
  <rect x="2" y="2" width="32" height="32" rx="9" fill="url(#logoGradient)"/>
  <path d="M18 8 L20.6 15.4 L28 18 L20.6 20.6 L18 28 L15.4 20.6 L8 18 L15.4 15.4 Z" fill="#FFFFFF"/>
  <text x="42" y="24" font-family="Poppins, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#6366F1" textLength="104" lengthAdjust="spacingAndGlyphs">AI <tspan fill="#0D9488">ToolHub</tspan></text>
